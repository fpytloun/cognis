    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <meta name="theme-color" content="#E9EEF4" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Paint the last verified account appearance as a cosmetic hint (see
      // src/lib/theme/startup-appearance.ts); account preferences replace it
      // once they bind. Without a valid hint, Classic follows the OS.
      (() => {
        const osDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let hint = null;
        try {
          const value = JSON.parse(localStorage.getItem('cognis-startup-appearance') || 'null');
          const rgb = /^\d{1,3} \d{1,3} \d{1,3}$/;
          const valid = (p) => p && /^(classic|porcelain|gruvbox|paper)$/.test(p.family) && /^#[0-9a-f]{6}$/i.test(p.chrome)
            && ['bg', 'surface', 'text', 'border', 'accent', 'onAccent'].every((key) => rgb.test(p[key]));
          if (value && value.v === 1 && /^(system|light|dark)$/.test(value.theme) && valid(value.light) && valid(value.dark)) hint = value;
        } catch {}
        const dark = hint && hint.theme !== 'system' ? hint.theme === 'dark' : osDark;
        const palette = hint && hint[dark ? 'dark' : 'light'];
        const root = document.documentElement;
        root.dataset.themeFamily = palette ? palette.family : 'classic';
        root.dataset.resolvedTheme = dark ? 'dark' : 'light';
        root.classList.toggle('dark', dark);
        document.querySelector('meta[name="color-scheme"]').content = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = palette ? palette.chrome : (dark ? '#07111A' : '#E9EEF4');
        if (palette) {
          // Literal colors: application CSS has not loaded yet. Higher
          // specificity than the startup defaults below.
          const style = document.createElement('style');
          style.id = 'cognis-startup-palette';
          style.textContent = `:root:root:root{--startup-bg:rgb(${palette.bg});--startup-surface:rgb(${palette.surface});--startup-text:rgb(${palette.text});--startup-border:rgb(${palette.border});--startup-accent:rgb(${palette.accent});--startup-on-accent:rgb(${palette.onAccent})}`;
          document.head.appendChild(style);
        }
      })();
    </script>

    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-light-750-1334.png"

    <script>
      (() => {
        const RECOVERY_KEY = 'cognis-startup-recovery-attempted';
        const CHUNK_ERROR_RE = /Failed to fetch dynamically imported module|Importing a module script failed|ChunkLoadError|error loading dynamically imported module/i;

        function extractMessage(value) {
          if (!value) return '';
          if (typeof value === 'string') return value;
          if (typeof value.message === 'string') return value.message;
          try {
            return String(value);
          } catch {
            return '';
          }
        }

        async function clearCognisCaches() {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister().catch(() => false)));
          }

          if ('caches' in window) {
            const names = await caches.keys();
            await Promise.all(
              names.filter((name) => name.startsWith('cognis-')).map((name) => caches.delete(name).catch(() => false))
            );
          }
        }

        function renderRecoveryScreen(message) {
          const mount = () => {
            if (document.getElementById('cognis-startup-recovery')) return;

            const wrapper = document.createElement('div');
            wrapper.id = 'cognis-startup-recovery';
            wrapper.style.cssText = 'position:fixed;inset:0;z-index:9999;box-sizing:border-box;display:flex;align-items:center;justify-content:center;overflow:auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-top:max(24px,calc(env(safe-area-inset-top,0px) + 12px));padding-bottom:24px;background:var(--startup-bg);color:var(--startup-text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;';
            wrapper.innerHTML = [
              '<div style="max-width:420px;width:100%;border:1px solid var(--startup-border);border-radius:24px;background:var(--startup-surface);padding:24px;">',
              '<h1 style="margin:0 0 12px;font-size:20px;font-weight:700;">Reload Cognis</h1>',
              '<p style="margin:0 0 12px;line-height:1.6;">This device has an old copy of Cognis, and the browser could not load the latest version.</p>',
              message ? `<p style="margin:0 0 16px;font-size:12px;line-height:1.5;word-break:break-word;">${message.replace(/[<>&]/g, '')}</p>` : '',
              '<button id="cognis-recovery-reload" type="button" style="width:100%;min-height:44px;border:0;border-radius:14px;background:var(--startup-accent);color:var(--startup-on-accent);font-size:15px;font-weight:700;cursor:pointer;">Reload app</button>',
              '</div>'
            ].join('');
            document.body.appendChild(wrapper);
            wrapper.querySelector('#cognis-recovery-reload')?.addEventListener('click', async () => {
              await clearCognisCaches().catch(() => {});
              window.location.reload();
            });
          };

          if (document.body) {
            mount();
          } else {
            document.addEventListener('DOMContentLoaded', mount, { once: true });
          }
        }

        async function recoverFromChunkFailure(message) {
          sessionStorage.setItem(RECOVERY_KEY, '1');
          renderRecoveryScreen(message);
        }

        window.__cognisStartupRecoverySuccess = () => {
          document.getElementById('cognis-startup-loading')?.remove();
          sessionStorage.removeItem(RECOVERY_KEY);
        };

        window.addEventListener('vite:preloadError', (event) => {
          event.preventDefault?.();
          void recoverFromChunkFailure('A cached app chunk could not be loaded.');
        });

        window.addEventListener('unhandledrejection', (event) => {
          const message = extractMessage(event.reason);
          if (!CHUNK_ERROR_RE.test(message)) return;
          event.preventDefault?.();
          void recoverFromChunkFailure(message);
        });

        window.addEventListener('error', (event) => {
          const message = extractMessage(event.error || event.message);
          const target = event.target;
          const isScriptResourceFailure =
            target instanceof HTMLScriptElement ||
            (target instanceof HTMLLinkElement && target.rel === 'modulepreload');
          if (!isScriptResourceFailure && !CHUNK_ERROR_RE.test(message)) return;
          void recoverFromChunkFailure(message || 'The latest app code failed to load.');
        }, true);
      })();
    </script>

    <title>Cognis</title>
    <style>
      /* Self-contained even when application CSS or JavaScript fails to load. */
      :root {
        color-scheme: light;
        --startup-bg: rgb(var(--color-chrome, 233 238 244)); --startup-surface: rgb(var(--color-surface, 255 255 255)); --startup-text: rgb(var(--color-foreground, 15 23 42));
        --startup-border: rgb(var(--color-control-border, 203 213 225)); --startup-accent: rgb(var(--color-accent, 3 111 159)); --startup-on-accent: rgb(var(--color-on-accent, 255 255 255));
      }
      :root[data-resolved-theme='dark'] {
        color-scheme: dark;
        --startup-bg: rgb(var(--color-chrome, 7 17 26)); --startup-surface: rgb(var(--color-surface, 15 23 42)); --startup-text: rgb(var(--color-foreground, 241 245 249));
        --startup-border: rgb(var(--color-control-border, 100 116 139)); --startup-accent: rgb(var(--color-accent, 56 189 248)); --startup-on-accent: rgb(var(--color-on-accent, 7 17 26));
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-resolved-theme]) {
          color-scheme: dark;
          --startup-bg: rgb(var(--color-chrome, 7 17 26)); --startup-surface: rgb(var(--color-surface, 15 23 42)); --startup-text: rgb(var(--color-foreground, 241 245 249));
          --startup-border: rgb(var(--color-control-border, 100 116 139)); --startup-accent: rgb(var(--color-accent, 56 189 248)); --startup-on-accent: rgb(var(--color-on-accent, 7 17 26));
        }
      }
      html { background: var(--startup-bg); }
      html[data-native-surface='rail'], html[data-native-surface='rail'] body { background: transparent !important; }
      html[data-native-surface='rail'] #cognis-startup-loading { display: none; }
      #cognis-startup-loading {
        position: fixed; inset: 0; z-index: 9998; display: grid; place-content: center;
        justify-items: center; gap: 24px; background: var(--startup-bg); color: var(--startup-text);
        font: 16px system-ui, sans-serif;
      }
      #cognis-startup-loading img { width: 96px; height: 96px; }
      #cognis-startup-loading .progress {
        width: 24px; height: 24px; border: 2px solid var(--startup-border);
        border-top-color: var(--startup-accent); border-radius: 50%; animation: cognis-spin 1s linear infinite;
      }
      @keyframes cognis-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #cognis-startup-loading .progress { animation: none; }
      }
      @media (forced-colors: active) {
        :root, :root[data-resolved-theme='dark'] { --startup-bg: Canvas; --startup-surface: Canvas; --startup-text: CanvasText;
          --startup-border: ButtonText; --startup-accent: Highlight; --startup-on-accent: HighlightText; }
        #cognis-startup-loading { background: Canvas; color: CanvasText; }
        #cognis-startup-loading .progress { border-color: GrayText; border-top-color: CanvasText; }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="cognis-startup-loading" role="status" aria-label="Loading Cognis">
      <img src="/brand/cognis-mark-color.svg" alt="" width="96" height="96" />
      <span aria-hidden="true">Loading Cognis</span>
      <span class="progress" aria-hidden="true"></span>
      <noscript>Enable JavaScript to use Cognis.</noscript>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
