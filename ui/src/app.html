<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111A" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cognis" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#0284C7" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Apple splash images per device. Media queries follow Apple's
         device-specific viewport dimensions so iOS picks the right one on
         launch from Home Screen. Assets generated by
         scripts/generate-pwa-assets.mjs. -->
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-2048-2732.png"
          media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-1668-2388.png"
          media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-1536-2048.png"
          media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-1290-2796.png"
          media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-1179-2556.png"
          media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-1170-2532.png"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-1125-2436.png"
          media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-828-1792.png"
          media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-750-1334.png"
          media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />

    <script>
      (() => {
        const RECOVERY_KEY = 'cognis-startup-recovery-attempted';
        const CHUNK_ERROR_RE = /Failed to fetch dynamically imported module|Importing a module script failed|ChunkLoadError|error loading dynamically imported module/i;

        function extractMessage(value) {
          if (!value) return '';
          if (typeof value === 'string') return value;
          if (typeof value.message === 'string') return value.message;
          try {
            return String(value);
          } catch {
            return '';
          }
        }

        async function clearCognisCaches() {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister().catch(() => false)));
          }

          if ('caches' in window) {
            const names = await caches.keys();
            await Promise.all(
              names.filter((name) => name.startsWith('cognis-')).map((name) => caches.delete(name).catch(() => false))
            );
          }
        }

        function renderRecoveryScreen(message) {
          const mount = () => {
            if (document.getElementById('cognis-startup-recovery')) return;

            const wrapper = document.createElement('div');
            wrapper.id = 'cognis-startup-recovery';
            wrapper.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background:#07111A;color:#e0f2fe;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;';
            wrapper.innerHTML = [
              '<div style="max-width:420px;width:100%;border:1px solid rgba(51,65,85,.8);border-radius:24px;background:rgba(15,23,42,.96);padding:24px;box-shadow:0 24px 64px rgba(0,0,0,.45);">',
              '<h1 style="margin:0 0 12px;font-size:20px;font-weight:700;color:#fff;">Reload Cognis</h1>',
              '<p style="margin:0 0 12px;line-height:1.6;color:#bae6fd;">The app code on this device is out of date and Safari could not load the latest version.</p>',
              message ? `<p style="margin:0 0 16px;font-size:12px;line-height:1.5;color:#7dd3fc;word-break:break-word;">${message.replace(/[<>&]/g, '')}</p>` : '',
              '<button id="cognis-recovery-reload" type="button" style="width:100%;min-height:44px;border:0;border-radius:14px;background:#38BDF8;color:#07111A;font-size:15px;font-weight:700;cursor:pointer;">Reload app</button>',
              '</div>'
            ].join('');
            document.body.appendChild(wrapper);
            wrapper.querySelector('#cognis-recovery-reload')?.addEventListener('click', async () => {
              await clearCognisCaches().catch(() => {});
              window.location.reload();
            });
          };

          if (document.body) {
            mount();
          } else {
            document.addEventListener('DOMContentLoaded', mount, { once: true });
          }
        }

        async function recoverFromChunkFailure(message) {
          sessionStorage.setItem(RECOVERY_KEY, '1');
          renderRecoveryScreen(message);
        }

        window.__cognisStartupRecoverySuccess = () => {
          sessionStorage.removeItem(RECOVERY_KEY);
        };

        window.addEventListener('vite:preloadError', (event) => {
          event.preventDefault?.();
          void recoverFromChunkFailure('A cached app chunk could not be loaded.');
        });

        window.addEventListener('unhandledrejection', (event) => {
          const message = extractMessage(event.reason);
          if (!CHUNK_ERROR_RE.test(message)) return;
          event.preventDefault?.();
          void recoverFromChunkFailure(message);
        });

        window.addEventListener('error', (event) => {
          const message = extractMessage(event.error || event.message);
          const target = event.target;
          const isScriptResourceFailure =
            target instanceof HTMLScriptElement ||
            (target instanceof HTMLLinkElement && target.rel === 'modulepreload');
          if (!isScriptResourceFailure && !CHUNK_ERROR_RE.test(message)) return;
          void recoverFromChunkFailure(message || 'The latest app code failed to load.');
        }, true);
      })();
    </script>

    <title>Cognis</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
