events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_x_cognis_ha_controller $cognis_test_upstream {
        default cognis_controllers;
        controller-1 cognis:8080;
        controller-2 cognis-2:8080;
    }

    upstream cognis_controllers {
        least_conn;
        server cognis:8080;
        server cognis-2:8080;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 8080;
        client_max_body_size 64m;

        location / {
            # Test-only deterministic routing. Production ingress does not
            # recognize this header.
            proxy_pass http://$cognis_test_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-Cognis-HA-Upstream $upstream_addr always;
        }
    }
}
