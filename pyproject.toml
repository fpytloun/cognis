[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-controller"
version = "0.3.0"
description = "Decoupled control plane for AI agents"
readme = "README.md"
license = { text = "TBD" }
requires-python = ">=3.12"
authors = [
    { name = "Filip Pytloun", email = "filip@pytloun.cz" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "litellm>=1.82.0",
    "typer>=0.12.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",
    "prometheus-client>=0.20.0",
    "markdownify>=0.14.0",
    "ddgs>=9.0.0",
    "websockets>=14.0",
    "python-multipart>=0.0.9",
    "mcp>=1.6.0",
    "croniter>=2.0.0",
    "python-dateutil>=2.9.0",
    "Markdown>=3.7",
    "pypdf>=5.4.0",
    "weasyprint>=63.0",
    "playwright>=1.53.0",
    "playwright-stealth>=2.0.0",
    "patchright>=1.55.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "respx>=0.21.0",
    "PyJWT[crypto]>=2.8.0",
    "types-python-jose>=3.3.0",
]
postgres = [
    "asyncpg>=0.29.0",
]
s3 = [
    "boto3>=1.34.0",
]
redis = [
    "redis[hiredis]>=5.0.0",
]

[project.scripts]
cognis-controller = "cognis.main:app"
cognis-executor = "cognis.executor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["cognis"]
include = ["cognis/ui_dist/**/*"]

[tool.hatch.build.targets.sdist]
include = [
    "/build.py",
    "/ui/**/*",
    "/docs/**/*",
]

[tool.hatch.build.hooks.custom]
path = "build.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "integration: marks tests that require live Mnemory + Intaris (started via uvx)",
    "live_server: marks tests that require a running Cognis server (not TestClient) for WebSocket/LLM flows",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["cognis"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "litellm.*",
    "alembic.*",
    "jose.*",
    "markdownify.*",
    "ddgs.*",
    "croniter.*",
    "dateutil.*",
]
ignore_missing_imports = true
