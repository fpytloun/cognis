<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Channel pairing flow</title>
  <desc id="desc">External senders are verified through channel accounts, pairing codes, contacts, and conversation delivery.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" /></marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b" /></marker>
    <style>
      .bg{fill:#020617}.panel{fill:#0f172a;stroke:#334155;stroke-width:2}.box{fill:#111827;stroke:#475569;stroke-width:1.5}.cyan{fill:#082f49;stroke:#38bdf8;stroke-width:2}.green{fill:#052e2b;stroke:#10b981;stroke-width:2}.purple{fill:#22134d;stroke:#8b5cf6;stroke-width:2}.amber{fill:#3b2603;stroke:#f59e0b;stroke-width:2}.red{fill:#4c0519;stroke:#fb7185;stroke-width:2}.slate{fill:#111827;stroke:#64748b;stroke-width:2}.text{fill:#f8fafc;font-family:Helvetica,Arial,sans-serif}.muted{fill:#94a3b8;font-family:Helvetica,Arial,sans-serif}.mono{fill:#bae6fd;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.arrow{stroke:#38bdf8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.muted-arrow{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow-muted);stroke-dasharray:6 6}.line{stroke:#334155;stroke-width:1.5;fill:none}.small{font-size:13px}.label{font-size:14px}.title{font-size:28px;font-weight:700}.h2{font-size:20px;font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="1200" height="660" rx="24" />
  <text x="600" y="54" text-anchor="middle" class="text title">Channel Pairing and Delivery</text>
  <text x="600" y="84" text-anchor="middle" class="muted label">External senders become trusted contacts before driving agent conversations</text>
  <rect x="70" y="235" width="190" height="105" rx="18" class="box" />
  <text x="165" y="274" text-anchor="middle" class="text h2">Remote Sender</text>
  <text x="165" y="304" text-anchor="middle" class="muted small">Signal · Slack · iMessage</text>
<text x="165" y="326" text-anchor="middle" class="muted small">or webhook platform</text>
  <rect x="320" y="235" width="190" height="105" rx="18" class="amber" />
  <text x="415" y="274" text-anchor="middle" class="text h2">Channel Account</text>
  <text x="415" y="304" text-anchor="middle" class="muted small">controller or executor</text>
<text x="415" y="326" text-anchor="middle" class="muted small">adapter placement</text>
  <rect x="570" y="150" width="190" height="105" rx="18" class="purple" />
  <text x="665" y="189" text-anchor="middle" class="text h2">Pairing Code</text>
  <text x="665" y="219" text-anchor="middle" class="muted small">short-lived verification</text>
  <rect x="570" y="335" width="190" height="105" rx="18" class="green" />
  <text x="665" y="374" text-anchor="middle" class="text h2">Verified Contact</text>
  <text x="665" y="404" text-anchor="middle" class="muted small">remote sender → user</text>
  <rect x="850" y="235" width="250" height="105" rx="18" class="cyan" />
  <text x="975" y="274" text-anchor="middle" class="text h2">Conversation</text>
  <text x="975" y="304" text-anchor="middle" class="muted small">normal Cognis session</text>
<text x="975" y="326" text-anchor="middle" class="muted small">guardrails + delivery</text>
  <path class="arrow" d="M260 288 L320 288" />
  <path class="arrow" d="M510 270 C545 225 545 205 570 202" />
  <path class="arrow" d="M665 255 L665 335" />
  <path class="arrow" d="M760 388 C815 360 830 325 850 300" />
  <path class="arrow" d="M510 305 C540 340 545 370 570 388" />
  <text x="282" y="270" text-anchor="start" class="muted small">message</text>
  <text x="520" y="218" text-anchor="start" class="muted small">unknown sender</text>
  <text x="686" y="296" text-anchor="start" class="muted small">redeem in UI</text>
  <text x="790" y="360" text-anchor="start" class="muted small">trusted route</text>
</svg>
