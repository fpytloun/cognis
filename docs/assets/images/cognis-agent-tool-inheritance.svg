<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Agent tool inheritance</title>
  <desc id="desc">Effective tools are resolved from executor tools, MCP servers, skills, agent restrictions, and guardrails.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" /></marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b" /></marker>
    <style>
      .bg{fill:#020617}.panel{fill:#0f172a;stroke:#334155;stroke-width:2}.box{fill:#111827;stroke:#475569;stroke-width:1.5}.cyan{fill:#082f49;stroke:#38bdf8;stroke-width:2}.green{fill:#052e2b;stroke:#10b981;stroke-width:2}.purple{fill:#22134d;stroke:#8b5cf6;stroke-width:2}.amber{fill:#3b2603;stroke:#f59e0b;stroke-width:2}.red{fill:#4c0519;stroke:#fb7185;stroke-width:2}.slate{fill:#111827;stroke:#64748b;stroke-width:2}.text{fill:#f8fafc;font-family:Helvetica,Arial,sans-serif}.muted{fill:#94a3b8;font-family:Helvetica,Arial,sans-serif}.mono{fill:#bae6fd;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.arrow{stroke:#38bdf8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.muted-arrow{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow-muted);stroke-dasharray:6 6}.line{stroke:#334155;stroke-width:1.5;fill:none}.small{font-size:13px}.label{font-size:14px}.title{font-size:28px;font-weight:700}.h2{font-size:20px;font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="1200" height="660" rx="24" />
  <text x="600" y="54" text-anchor="middle" class="text title">Agent Tool Inheritance</text>
  <text x="600" y="84" text-anchor="middle" class="muted label">Effective capability is layered, not a single global allow-list</text>
  <rect x="70" y="145" width="240" height="105" rx="18" class="amber" />
  <text x="190" y="184" text-anchor="middle" class="text h2">Executor</text>
  <text x="190" y="214" text-anchor="middle" class="muted label">native tools · tool groups</text>
<text x="190" y="236" text-anchor="middle" class="muted label">assigned MCP servers</text>
  <rect x="70" y="310" width="240" height="105" rx="18" class="purple" />
  <text x="190" y="349" text-anchor="middle" class="text h2">Skills</text>
  <text x="190" y="379" text-anchor="middle" class="muted label">instructions · linked tools</text>
<text x="190" y="401" text-anchor="middle" class="muted label">bundled executable tools</text>
  <rect x="480" y="215" width="250" height="150" rx="18" class="cyan" />
  <text x="605" y="255" text-anchor="middle" class="text h2">Agent</text>
  <text x="605" y="288" text-anchor="middle" class="muted label">identity · model override</text>
<text x="605" y="310" text-anchor="middle" class="muted label">executor selection</text>
<text x="605" y="332" text-anchor="middle" class="muted label">tool restrictions</text>
  <rect x="890" y="145" width="240" height="105" rx="18" class="green" />
  <text x="1010" y="184" text-anchor="middle" class="text h2">Guardrails</text>
  <text x="1010" y="214" text-anchor="middle" class="muted label">allow · deny · escalate</text>
<text x="1010" y="236" text-anchor="middle" class="muted label">non-bypassable checks</text>
  <rect x="875" y="335" width="270" height="105" rx="18" class="box" />
  <text x="1010" y="374" text-anchor="middle" class="text h2">Effective Tool Set</text>
  <text x="1010" y="404" text-anchor="middle" class="muted label">what the model can call now</text>
  <path class="arrow" d="M310 198 C390 200 430 235 480 260" />
  <path class="arrow" d="M310 362 C390 358 430 325 480 310" />
  <path class="arrow" d="M730 290 C800 260 835 215 890 198" />
  <path class="arrow" d="M730 310 C800 340 830 370 875 385" />
  <path class="arrow" d="M1010 250 L1010 335" />
  <text x="355" y="185" text-anchor="start" class="muted small">exposes</text>
  <text x="350" y="375" text-anchor="start" class="muted small">loads on demand</text>
  <text x="770" y="250" text-anchor="start" class="muted small">runtime call</text>
  <text x="1022" y="294" text-anchor="start" class="muted small">decision</text>
</svg>
