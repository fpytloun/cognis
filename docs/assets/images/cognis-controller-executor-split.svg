<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Controller and executor split</title>
  <desc id="desc">The controller owns orchestration and policy while executors perform tool execution and optional local inference.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" /></marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b" /></marker>
    <style>
      .bg{fill:#020617}.panel{fill:#0f172a;stroke:#334155;stroke-width:2}.box{fill:#111827;stroke:#475569;stroke-width:1.5}.cyan{fill:#082f49;stroke:#38bdf8;stroke-width:2}.green{fill:#052e2b;stroke:#10b981;stroke-width:2}.purple{fill:#22134d;stroke:#8b5cf6;stroke-width:2}.amber{fill:#3b2603;stroke:#f59e0b;stroke-width:2}.red{fill:#4c0519;stroke:#fb7185;stroke-width:2}.slate{fill:#111827;stroke:#64748b;stroke-width:2}.text{fill:#f8fafc;font-family:Helvetica,Arial,sans-serif}.muted{fill:#94a3b8;font-family:Helvetica,Arial,sans-serif}.mono{fill:#bae6fd;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.arrow{stroke:#38bdf8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.muted-arrow{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow-muted);stroke-dasharray:6 6}.line{stroke:#334155;stroke-width:1.5;fill:none}.small{font-size:13px}.label{font-size:14px}.title{font-size:28px;font-weight:700}.h2{font-size:20px;font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="1200" height="660" rx="24" />
  <text x="600" y="54" text-anchor="middle" class="text title">Controller / Executor Split</text>
  <text x="600" y="84" text-anchor="middle" class="muted label">The controller decides. Executors do.</text>
  <rect x="90" y="140" width="405" height="360" rx="18" class="cyan" />
  <text x="292" y="182" text-anchor="middle" class="text h2">Controller = Brain</text>
  <text x="135" y="225" text-anchor="start" class="text label">• agent loops and workflow engine</text>
<text x="135" y="259" text-anchor="start" class="text label">• context assembly and model routing</text>
<text x="135" y="293" text-anchor="start" class="text label">• Mnemory recall and Intaris evaluation</text>
<text x="135" y="327" text-anchor="start" class="text label">• users, projects, tasks, settings</text>
<text x="135" y="361" text-anchor="start" class="text label">• chat, approvals, notifications</text>
  <rect x="705" y="140" width="405" height="360" rx="18" class="amber" />
  <text x="908" y="182" text-anchor="middle" class="text h2">Executor = Hands</text>
  <text x="750" y="225" text-anchor="start" class="text label">• filesystem, shell, search, LSP</text>
<text x="750" y="259" text-anchor="start" class="text label">• browser sessions and profiles</text>
<text x="750" y="293" text-anchor="start" class="text label">• MCP servers and skill tools</text>
<text x="750" y="327" text-anchor="start" class="text label">• optional local model calls</text>
<text x="750" y="361" text-anchor="start" class="text label">• local/private-network runtime state</text>
  <rect x="430" y="285" width="340" height="70" rx="18" class="box" />
  <text x="600" y="315" text-anchor="middle" class="text h2">JSON-RPC over WebSocket</text>
  <text x="600" y="342" text-anchor="middle" class="mono small">tool.execute · heartbeat · inference proxy</text>
  <path class="arrow" d="M495 320 L430 320" />
  <path class="arrow" d="M705 320 L770 320" />
  <text x="600" y="540" text-anchor="middle" class="muted label">Even local development preserves the boundary:</text>
<text x="600" y="562" text-anchor="middle" class="muted label">controller orchestration never becomes direct tool execution.</text>
</svg>
