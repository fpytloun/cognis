<text x="711.5" y="67" fill="#1971c2" font-family="Helvetica, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="auto">Executor = Hands</text>
<text x="560" y="115" fill="#1e1e1e" font-family="Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="auto">Executes built-in tools</text>
<text x="560" y="133.75" fill="#1e1e1e" font-family="Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="auto">Runs MCP servers and clients</text>
<text x="560" y="152.5" fill="#1e1e1e" font-family="Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="auto">Returns tool output</text>
<text x="560" y="171.25" fill="#1e1e1e" font-family="Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="auto">Can proxy local inference</text>
<text x="560" y="190" fill="#1e1e1e" font-family="Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="auto">Reports health and manifests</text>
<text x="560" y="208.75" fill="#1e1e1e" font-family="Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="auto">Has no memory or session logic</text>
<text x="560" y="227.5" fill="#1e1e1e" font-family="Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="auto">Has no guardrails authority</text>
