<text x="233.5" y="67" fill="#2f9e44" font-family="Helvetica, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="auto">Controller = Brain</text>
<text x="75" y="115" fill="#1e1e1e" font-family="Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="auto">Runs agent loops</text>
<text x="75" y="133.75" fill="#1e1e1e" font-family="Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="auto">Calls or routes LLMs</text>
<text x="75" y="152.5" fill="#1e1e1e" font-family="Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="auto">Assembles context</text>
<text x="75" y="171.25" fill="#1e1e1e" font-family="Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="auto">Requests recall from Mnemory</text>
<text x="75" y="190" fill="#1e1e1e" font-family="Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="auto">Evaluates tools with Intaris</text>
<text x="75" y="208.75" fill="#1e1e1e" font-family="Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="auto">Records session events</text>
<text x="75" y="227.5" fill="#1e1e1e" font-family="Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="auto">Streams results to clients</text>
<text x="75" y="246.25" fill="#1e1e1e" font-family="Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="auto">Manages tasks, workflows, channels</text>
