<text x="470" y="221.5" fill="#f08c00" font-family="Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="auto">this boundary</text>
<text x="493" y="491" fill="#e03131" font-family="Helvetica, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="auto">Hard rule: the controller never executes tool calls directly.</text>
