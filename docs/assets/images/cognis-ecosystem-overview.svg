<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Cognis ecosystem overview</title>
  <desc id="desc">Cognis coordinates users, memory, guardrails, executors, LLM providers, and channels without owning every subsystem.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" /></marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b" /></marker>
    <style>
      .bg{fill:#020617}.panel{fill:#0f172a;stroke:#334155;stroke-width:2}.box{fill:#111827;stroke:#475569;stroke-width:1.5}.cyan{fill:#082f49;stroke:#38bdf8;stroke-width:2}.green{fill:#052e2b;stroke:#10b981;stroke-width:2}.purple{fill:#22134d;stroke:#8b5cf6;stroke-width:2}.amber{fill:#3b2603;stroke:#f59e0b;stroke-width:2}.red{fill:#4c0519;stroke:#fb7185;stroke-width:2}.slate{fill:#111827;stroke:#64748b;stroke-width:2}.text{fill:#f8fafc;font-family:Helvetica,Arial,sans-serif}.muted{fill:#94a3b8;font-family:Helvetica,Arial,sans-serif}.mono{fill:#bae6fd;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.arrow{stroke:#38bdf8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.muted-arrow{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow-muted);stroke-dasharray:6 6}.line{stroke:#334155;stroke-width:1.5;fill:none}.small{font-size:13px}.label{font-size:14px}.title{font-size:28px;font-weight:700}.h2{font-size:20px;font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="1200" height="660" rx="24" />
  <text x="600" y="54" text-anchor="middle" class="text title">Cognis Ecosystem Overview</text>
  <text x="600" y="84" text-anchor="middle" class="muted label">Controller orchestration with decoupled memory, guardrails, tools, channels, and inference</text>
  <rect x="430" y="150" width="340" height="210" rx="18" class="cyan" />
  <text x="600" y="190" text-anchor="middle" class="text h2">Cognis Controller</text>
  <text x="600" y="225" text-anchor="middle" class="muted label">agents · conversations · projects</text>
<text x="600" y="247" text-anchor="middle" class="muted label">tasks · workflows · schedules</text>
<text x="600" y="269" text-anchor="middle" class="muted label">provider routing · web UI</text>
  <rect x="70" y="150" width="250" height="100" rx="18" class="green" />
  <text x="195" y="190" text-anchor="middle" class="text h2">Mnemory</text>
  <text x="195" y="220" text-anchor="middle" class="muted label">persistent memory</text>
<text x="195" y="242" text-anchor="middle" class="muted label">recall + remember</text>
  <rect x="70" y="315" width="250" height="100" rx="18" class="purple" />
  <text x="195" y="355" text-anchor="middle" class="text h2">Intaris</text>
  <text x="195" y="385" text-anchor="middle" class="muted label">guardrails · approvals</text>
<text x="195" y="407" text-anchor="middle" class="muted label">session content · audit</text>
  <rect x="880" y="135" width="250" height="120" rx="18" class="amber" />
  <text x="1005" y="174" text-anchor="middle" class="text h2">Executors</text>
  <text x="1005" y="204" text-anchor="middle" class="muted label">tools · browsers · shells</text>
<text x="1005" y="226" text-anchor="middle" class="muted label">MCP · optional inference</text>
  <rect x="880" y="315" width="250" height="100" rx="18" class="slate" />
  <text x="1005" y="355" text-anchor="middle" class="text h2">LLM Providers</text>
  <text x="1005" y="385" text-anchor="middle" class="muted label">OpenAI · Anthropic · Ollama</text>
<text x="1005" y="407" text-anchor="middle" class="muted label">OpenAI-compatible · LiteLLM</text>
  <rect x="430" y="500" width="340" height="85" rx="18" class="box" />
  <text x="600" y="535" text-anchor="middle" class="text h2">Users and Channels</text>
  <text x="600" y="562" text-anchor="middle" class="muted label">Web UI · PWA · Signal · Slack · iMessage · webhooks</text>
  <path class="arrow" d="M430 215 C380 205 350 200 320 198" />
  <path class="arrow" d="M430 330 C380 340 350 350 320 358" />
  <path class="arrow" d="M770 210 C815 190 845 178 880 178" />
  <path class="arrow" d="M770 325 C820 340 850 356 880 365" />
  <path class="arrow" d="M600 500 L600 360" />
  <text x="352" y="184" text-anchor="start" class="muted small">memory context</text>
  <text x="344" y="337" text-anchor="start" class="muted small">evaluate + record</text>
  <text x="805" y="164" text-anchor="start" class="muted small">tool.execute</text>
  <text x="800" y="342" text-anchor="start" class="muted small">inference route</text>
</svg>
