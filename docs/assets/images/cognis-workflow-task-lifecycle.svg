<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Workflow task lifecycle</title>
  <desc id="desc">A task moves from creation through queueing, workflow steps, gates, deliverables, and delivery back to chat or channels.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" /></marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b" /></marker>
    <style>
      .bg{fill:#020617}.panel{fill:#0f172a;stroke:#334155;stroke-width:2}.box{fill:#111827;stroke:#475569;stroke-width:1.5}.cyan{fill:#082f49;stroke:#38bdf8;stroke-width:2}.green{fill:#052e2b;stroke:#10b981;stroke-width:2}.purple{fill:#22134d;stroke:#8b5cf6;stroke-width:2}.amber{fill:#3b2603;stroke:#f59e0b;stroke-width:2}.red{fill:#4c0519;stroke:#fb7185;stroke-width:2}.slate{fill:#111827;stroke:#64748b;stroke-width:2}.text{fill:#f8fafc;font-family:Helvetica,Arial,sans-serif}.muted{fill:#94a3b8;font-family:Helvetica,Arial,sans-serif}.mono{fill:#bae6fd;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.arrow{stroke:#38bdf8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.muted-arrow{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow-muted);stroke-dasharray:6 6}.line{stroke:#334155;stroke-width:1.5;fill:none}.small{font-size:13px}.label{font-size:14px}.title{font-size:28px;font-weight:700}.h2{font-size:20px;font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="1200" height="660" rx="24" />
  <text x="600" y="54" text-anchor="middle" class="text title">Workflow Task Lifecycle</text>
  <text x="600" y="84" text-anchor="middle" class="muted label">Durable work runs through explicit steps, gates, deliverables, and delivery</text>
  <rect x="70" y="250" width="150" height="90" rx="18" class="box" />
  <text x="145" y="286" text-anchor="middle" class="text h2">Create Task</text>
  <text x="145" y="315" text-anchor="middle" class="muted small">chat · API · schedule</text>
  <rect x="270" y="250" width="150" height="90" rx="18" class="cyan" />
  <text x="345" y="286" text-anchor="middle" class="text h2">Queued</text>
  <text x="345" y="315" text-anchor="middle" class="muted small">capacity + dependencies</text>
  <rect x="470" y="250" width="150" height="90" rx="18" class="amber" />
  <text x="545" y="286" text-anchor="middle" class="text h2">Run Step</text>
  <text x="545" y="315" text-anchor="middle" class="muted small">agent loop + tools</text>
  <rect x="670" y="250" width="150" height="90" rx="18" class="purple" />
  <text x="745" y="286" text-anchor="middle" class="text h2">Gate</text>
  <text x="745" y="315" text-anchor="middle" class="muted small">approve · deny · input</text>
  <rect x="870" y="250" width="150" height="90" rx="18" class="green" />
  <text x="945" y="286" text-anchor="middle" class="text h2">Deliverable</text>
  <text x="945" y="315" text-anchor="middle" class="muted small">typed output</text>
  <rect x="475" y="430" width="250" height="85" rx="18" class="box" />
  <text x="600" y="466" text-anchor="middle" class="text h2">Conversation / Channel</text>
  <text x="600" y="493" text-anchor="middle" class="muted small">result delivered once, back where people are</text>
  <path class="arrow" d="M220 295 L270 295" />
  <path class="arrow" d="M420 295 L470 295" />
  <path class="arrow" d="M620 295 L670 295" />
  <path class="arrow" d="M820 295 L870 295" />
  <path class="arrow" d="M945 340 C900 420 785 472 725 472" />
  <path class="arrow" d="M670 340 C625 405 600 420 600 430" />
  <path class="muted-arrow" d="M745 250 C730 175 575 160 545 250" />
  <text x="585" y="156" text-anchor="middle" class="muted small">revision or retry can re-enter a step</text>
  <text x="835" y="396" text-anchor="start" class="muted small">final output</text>
  <text x="626" y="390" text-anchor="start" class="muted small">human input</text>
</svg>
