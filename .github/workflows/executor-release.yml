name: Executor release assets

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Match tag to package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          python3 - "$version" <<'PY'
          import pathlib
          import sys
          import tomllib

          expected = sys.argv[1]
          versions = []
          for path in ("packages/common/pyproject.toml", "packages/executor/pyproject.toml"):
              with pathlib.Path(path).open("rb") as stream:
                  versions.append(tomllib.load(stream)["project"]["version"])
          if versions != [expected, expected]:
              raise SystemExit(f"tag {expected} does not match package versions {versions}")
          PY

  build:
    name: Build ${{ matrix.architecture }} asset
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-14
          - architecture: x86_64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.10.12"
      - name: Build frozen payload
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 packaging/homebrew/build_executor_asset.py \
            --architecture "${{ matrix.architecture }}" \
            --output "cognis-executor-${version}-macos-${{ matrix.architecture }}.tar.gz"
      - name: Verify manifest and checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="cognis-executor-${version}-macos-${{ matrix.architecture }}.tar.gz"
          manifest="cognis-executor-${version}-macos-${{ matrix.architecture }}.manifest.json"
          tar -xOzf "$asset" manifest.json > "$manifest"
          python3 - "$manifest" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as stream:
              manifest = json.load(stream)
          assert manifest["schema"] == "cognis.executor.asset.v1"
          assert manifest["file_count"] > 0
          assert manifest["payload_sha256"]
          PY
          shasum -a 256 "$asset" > "cognis-executor-${version}-macos-${{ matrix.architecture }}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: executor-${{ matrix.architecture }}
          path: |
            cognis-executor-*.tar.gz
            cognis-executor-*.sha256
            cognis-executor-*.manifest.json

  publish:
    name: Publish immutable release assets and formula metadata
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: executor-*
          merge-multiple: true
          path: dist
      - name: Verify all checksums
        working-directory: dist
        run: |
          shasum -a 256 -c cognis-executor-*-macos-arm64.sha256
          shasum -a 256 -c cognis-executor-*-macos-x86_64.sha256
      - name: Upload release assets without replacement
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/cognis-executor-*.tar.gz dist/cognis-executor-*.sha256
      - name: Emit formula metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          arm_asset="cognis-executor-${version}-macos-arm64.tar.gz"
          intel_asset="cognis-executor-${version}-macos-x86_64.tar.gz"
          arm_sha="$(awk '{print $1}' "dist/${arm_asset%.tar.gz}.sha256")"
          intel_sha="$(awk '{print $1}' "dist/${intel_asset%.tar.gz}.sha256")"
          python3 packaging/homebrew/generate_formula.py \
            --version "$version" \
            --arm64-url "https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${arm_asset}" \
            --arm64-sha256 "$arm_sha" \
            --x86-64-url "https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${intel_asset}" \
            --x86-64-sha256 "$intel_sha" \
            --output dist/CognisExecutor.rb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: executor-formula-metadata
          path: dist/CognisExecutor.rb
