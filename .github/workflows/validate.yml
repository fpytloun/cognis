name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-packages --all-extras
      - name: Lint
        run: uv run ruff check cognis/ tests/
      - name: Check formatting
        run: uv run ruff format --check cognis/ tests/
      - name: Type-check
        run: |
          MYPYPATH=packages/common/src:packages/executor/src \
            uv run mypy --explicit-package-bases cognis/
          uv run --package cognis-common mypy packages/common/src/cognis
          MYPYPATH=.:packages/common/src:packages/executor/src \
            uv run --package cognis-executor mypy --explicit-package-bases \
            packages/executor/src/cognis
      - name: Run unit tests
        run: make test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --run
      - name: Check types
        run: npm run check
      - name: Build standalone UI
        run: npm run build:standalone
