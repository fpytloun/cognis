name: Upload Python Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-build:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build common release distributions
        run: |
          python -m pip install build
          cd packages/common
          python -m build --wheel --sdist --outdir ../../dist-common

      - name: Upload common distributions
        uses: actions/upload-artifact@v4
        with:
          name: common-release-dists
          path: dist-common/

  common-publish:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    needs: common-build
    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve common distributions
        uses: actions/download-artifact@v4
        with:
          name: common-release-dists
          path: dist/

      - name: Publish common distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  controller-build:
    runs-on: ubuntu-latest
    needs: common-publish
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.common-publish.result == 'success') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build controller release distributions
        run: |
          python -m pip install build
          pyproject-build

      - name: Verify controller runtime assets
        run: python scripts/verify_controller_dist_assets.py dist --dockerfile Dockerfile

      - name: Upload controller distributions
        uses: actions/upload-artifact@v4
        with:
          name: controller-release-dists
          path: dist/

  controller-publish:
    runs-on: ubuntu-latest
    needs:
      - controller-build
      - executor-publish
    if: ${{ always() && needs.controller-build.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.executor-publish.result == 'success') }}
    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve controller distributions
        uses: actions/download-artifact@v4
        with:
          name: controller-release-dists
          path: dist/

      - name: Publish controller distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  executor-build:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    needs: common-publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build executor release distributions
        env:
          COGNIS_SKIP_UI_BUILD: "1"
        run: |
          python -m pip install uv
          uv build --package cognis-executor --out-dir dist-executor

      - name: Upload executor distributions
        uses: actions/upload-artifact@v4
        with:
          name: executor-release-dists
          path: dist-executor/

  executor-publish:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    needs:
      - executor-build
    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve executor distributions
        uses: actions/download-artifact@v4
        with:
          name: executor-release-dists
          path: dist/

      - name: Publish executor distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
