name: Upload Python Packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  controller-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build controller release distributions
        run: |
          python -m pip install build
          pyproject-build

      - name: Verify controller runtime assets
        run: python scripts/verify_controller_dist_assets.py dist

      - name: Upload controller distributions
        uses: actions/upload-artifact@v4
        with:
          name: controller-release-dists
          path: dist/

  controller-publish:
    runs-on: ubuntu-latest
    needs:
      - controller-build
    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve controller distributions
        uses: actions/download-artifact@v4
        with:
          name: controller-release-dists
          path: dist/

      - name: Publish controller distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  executor-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build executor release distributions
        env:
          COGNIS_SKIP_UI_BUILD: "1"
        run: |
          python -m pip install build
          python scripts/build_executor_package.py --out-dir dist-executor

      - name: Upload executor distributions
        uses: actions/upload-artifact@v4
        with:
          name: executor-release-dists
          path: dist-executor/

  executor-publish:
    runs-on: ubuntu-latest
    needs:
      - executor-build
    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve executor distributions
        uses: actions/download-artifact@v4
        with:
          name: executor-release-dists
          path: dist/

      - name: Publish executor distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
