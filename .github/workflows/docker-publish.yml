name: Publish Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  RELEASE_CREATED: ${{ github.event.release.published_at || github.event.repository.updated_at }}

jobs:
  controller-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Verify tagged revision
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_TAG}^{commit}")"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=cognis-controller
            org.opencontainers.image.description=Cognis controller image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.created=${{ env.RELEASE_CREATED }}
          cache-from: type=gha,scope=controller
          cache-to: type=gha,mode=max,scope=controller

      - name: Write controller image reference
        run: |
          mkdir -p docker-image-artifacts
          {
            printf 'image=ghcr.io/%s\n' '${{ github.repository }}'
            printf 'release_tag=%s\n' '${{ env.RELEASE_TAG }}'
            printf 'digest=%s\n' '${{ steps.build.outputs.digest }}'
          } > docker-image-artifacts/controller.txt

      - name: Upload controller image reference
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-controller
          path: docker-image-artifacts/controller.txt

  executor-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Verify tagged revision
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_TAG}^{commit}")"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keep these builds sequential. Each target extends the prior target and
      # reuses its BuildKit layers on this runner and in the registry.
      - name: Build and push minimal executor
        id: build_minimal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.executor
          target: minimal
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-executor:minimal
            ghcr.io/${{ github.repository }}-executor:${{ env.RELEASE_TAG }}-minimal
          labels: |
            org.opencontainers.image.title=cognis-executor-minimal
            org.opencontainers.image.description=Minimal Cognis remote executor
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}-minimal
            org.opencontainers.image.created=${{ env.RELEASE_CREATED }}
          cache-from: type=gha,scope=executor

      - name: Build and push general executor
        id: build_general
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.executor
          target: general
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-executor:latest
            ghcr.io/${{ github.repository }}-executor:general
            ghcr.io/${{ github.repository }}-executor:${{ env.RELEASE_TAG }}
            ghcr.io/${{ github.repository }}-executor:${{ env.RELEASE_TAG }}-general
          labels: |
            org.opencontainers.image.title=cognis-executor
            org.opencontainers.image.description=General-purpose Cognis remote executor
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.created=${{ env.RELEASE_CREATED }}
          cache-from: type=gha,scope=executor

      - name: Build and push development executor
        id: build_development
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.executor
          target: development
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-executor:development
            ghcr.io/${{ github.repository }}-executor:${{ env.RELEASE_TAG }}-development
          labels: |
            org.opencontainers.image.title=cognis-executor-development
            org.opencontainers.image.description=Cognis remote executor with preinstalled language servers
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}-development
            org.opencontainers.image.created=${{ env.RELEASE_CREATED }}
          cache-from: type=gha,scope=executor
          cache-to: type=gha,mode=max,scope=executor

      - name: Write executor image references
        run: |
          mkdir -p docker-image-artifacts
          {
            printf 'image=ghcr.io/%s-executor\n' '${{ github.repository }}'
            printf 'release_tag=%s\n' '${{ env.RELEASE_TAG }}'
            printf 'minimal_digest=%s\n' '${{ steps.build_minimal.outputs.digest }}'
            printf 'general_digest=%s\n' '${{ steps.build_general.outputs.digest }}'
            printf 'development_digest=%s\n' '${{ steps.build_development.outputs.digest }}'
          } > docker-image-artifacts/executor.txt

      - name: Upload executor image references
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-executor
          path: docker-image-artifacts/executor.txt
