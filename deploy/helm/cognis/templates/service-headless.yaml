apiVersion: v1
kind: Service
metadata:
  name: {{ include "cognis.fullname" . }}-internal
  labels:
    {{- include "cognis.labels" . | nindent 4 }}
  {{- with .Values.internalService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  clusterIP: None
  # Keep draining owners reachable for already-admitted bridge calls.
  publishNotReadyAddresses: true
  selector:
    {{- include "cognis.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
