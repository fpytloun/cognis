{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cognis.fullname" . }}
  labels:
    {{- include "cognis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cognis.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cognis.selectorLabels" . | nindent 14 }}
        {{- with .Values.networkPolicy.ingressNamespaceSelector }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
{{- end }}
