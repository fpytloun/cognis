{{- if eq .Values.mode "ha" }}
{{- include "cognis.validate" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cognis.fullname" . }}
  labels:
    {{- include "cognis.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "cognis.fullname" . }}-internal
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  minReadySeconds: 5
  selector:
    matchLabels:
      {{- include "cognis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "cognis.commonEnv" . | sha256sum }}
        {{- $metricsAnnotations := dict "prometheus.io/scrape" "true" "prometheus.io/path" "/api/metrics" "prometheus.io/port" (printf "%v" .Values.service.port) }}
        {{- $podAnnotations := mergeOverwrite $metricsAnnotations (deepCopy (.Values.podAnnotations | default dict)) }}
        {{- toYaml $podAnnotations | nindent 8 }}
      labels:
        {{- include "cognis.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      serviceAccountName: {{ include "cognis.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "cognis.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: COGNIS_CONTROLLER_ID
              value: "$(POD_NAME)"
            - name: COGNIS_CONTROLLER_INTERNAL_URL
              value: "http://$(POD_NAME).{{ include "cognis.fullname" . }}-internal.$(POD_NAMESPACE).svc:{{ .Values.service.port }}"
            {{- include "cognis.commonEnv" . | nindent 12 }}
            {{- if .Values.crypto.existingSecret }}
            - name: COGNIS_JWT_PRIVATE_KEY_PATH
              value: /var/run/cognis/crypto/private.pem
            - name: COGNIS_JWT_PUBLIC_KEY_PATH
              value: /var/run/cognis/crypto/public.pem
            - name: COGNIS_SECRETS_KEY_PATH
              value: /var/run/cognis/crypto/secrets.key
            {{- end }}
          {{- with .Values.config.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /api/livez
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /api/livez
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.preStopDelaySeconds }}"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.config.dataDir }}
            {{- if .Values.crypto.existingSecret }}
            - name: crypto
              mountPath: /var/run/cognis/crypto
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (include "cognis.fullname" .) .Values.persistence.existingClaim }}
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if .Values.crypto.existingSecret }}
        - name: crypto
          secret:
            secretName: {{ .Values.crypto.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.crypto.jwtPrivateKeyKey }}
                path: private.pem
              - key: {{ .Values.crypto.jwtPublicKeyKey }}
                path: public.pem
              - key: {{ .Values.crypto.secretsKeyKey }}
                path: secrets.key
        {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
