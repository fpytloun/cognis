id: long-rich-deliverable
description: |
  Creates a long Rich Deliverable through the real write_deliverable tool so
  browser E2E can exercise contextual active-message TOC navigation.
trigger: "scenario:long-rich-deliverable"
turns:
  - role: assistant
    steps:
      - type: tool_call
        call_id: call_write_long_deliverable
        name: write_deliverable
        arguments:
          action: "write_deliverable"
          title: "Long navigation report"
          content: "Long navigation report fallback"
          format: "rich"
          target: "channel"
          rich:
            metadata:
              toc: true
