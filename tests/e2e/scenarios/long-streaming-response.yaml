id: long-streaming-response
description: |
  Long streaming text response with many chunks — tests that the rAF
  batching and coalescing work correctly under sustained token load.

  Inspired by production sessions where the agent produces a detailed
  analysis or code review spanning hundreds of tokens. The key risk is
  that rapid token delivery causes the client to miss the final
  streaming:false state or produce duplicate items.

  Tests:
  - Single assistant item throughout (no duplicates)
  - streaming:false after message_complete
  - No position jumps (orderKey stable)
  - rAF batching handles burst correctly

  All content is synthetic.
trigger: "scenario:long-streaming-response"
